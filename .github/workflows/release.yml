name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" Otbor.exe kit/UPDATE.bat
          --verify-tag
          --title "Otbor ${GITHUB_REF_NAME#v}"
          --notes-file RELEASE_NOTES.md
